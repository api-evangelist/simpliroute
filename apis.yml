aid: simpliroute
name: Simpliroute
description: >-
  SimpliRoute is an AI-powered last-mile route optimization and delivery management platform,
  founded in Chile and operating across Latin America and beyond. Its REST API (base URL
  https://api.simpliroute.com/v1, authenticated with an Authorization Token header) lets
  developers create delivery and pickup visits, build daily plans, run the route-optimization
  engine over vehicles and deliveries, manage vehicles, drivers, couriers, clients, skills,
  zones and fleets, handle invoices, and subscribe to lifecycle webhooks (route started, on
  its way, checkout, route finished). First-party Node/TypeScript and Python SDKs are published
  under the github.com/simpliroute organization.
